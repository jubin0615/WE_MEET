name: CLI and analysis tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . -r vulnapp/requirements.txt httpx
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_dashboard_ui.cjs
      - name: Rule tests (vulnerable and safe cases)
        run: python -m bench.check_rules
      - name: Detection benchmark gate
        run: python -m bench.run
      - name: Installed CLI outside repository
        shell: python
        run: |
          import json, os, shutil, subprocess, tempfile, sys
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              subprocess.run([sys.executable, "-c",
                  "from pathlib import Path; from fastapi.testclient import TestClient; "
                  "from vibescan.dashboard import dashboard_app; "
                  "c = TestClient(dashboard_app(Path('missing'), '127.0.0.1:8765', 'test'), base_url='http://127.0.0.1:8765'); "
                  "assert all(c.get(p).status_code == 200 for p in ['/', '/assets/dashboard.js', '/assets/dashboard.css']); "
                  "assert c.get('/assets/theme.js').status_code == 404; "
                  "assert c.get('/assets/fonts/PretendardVariable.woff2').content[:4] == b'wOF2'"],
                  cwd=base, check=True)
              sample = base / "sample"
              sample.mkdir()
              for name in ("app.py", "static_cases.py"):
                  shutil.copy(Path("vulnapp") / name, sample / name)
              shutil.copy(Path("rules/vibescan/vs-java-sql.java"), sample / "SearchController.java")
              for args in (["init", "-q"], ["add", "."], ["-c", "user.name=Test", "-c", "user.email=test@example.invalid", "commit", "-qm", "sample"]):
                  subprocess.run(["git", "-C", str(sample), *args], check=True)
              env = dict(os.environ, XDG_CONFIG_HOME=str(base / "config"), LOCALAPPDATA=str(base / "config"))
              subprocess.run(["vibescan", "scan", str(sample), "--offline", "--output", str(base / "out")], cwd=base, env=env, check=True)
              raw = next((base / "out").glob("*/scan_result.json"))
              result = json.loads(raw.read_text(encoding="utf-8"))
              assert result["languages"]["java"] == 1
              assert sum(f["rule_id"] == "vs-java-sql" for f in result["findings"]) == 4
              assert {"CWE-798", "CWE-89", "CWE-79", "CWE-614"} <= {f["cwe"] for f in result["findings"]}
              assert all(f["fingerprint"] and f["category"].startswith("VS-") and f["owasp"] for f in result["findings"])
              assert result["profile"]["framework"] == "Flask" and result["profile"]["routes"] == 2
              assert {f"VS-{i:02}" for i in range(1, 11)} == {c["code"] for c in result["coverage"]}
              assert {f"A{i:02}:2025" for i in range(1, 11)} == {c["code"] for c in result["owasp_coverage"]}
              assert all(c["execution"] in {"completed", "partial", "skipped", "not_applicable", "manual"} for c in result["coverage"])
              assert "we_meet_fixture_token" not in raw.read_text(encoding="utf-8")
              assert raw.with_name("report.md").read_text(encoding="utf-8") == result["report_md"]
              shutil.copytree(raw.parent, Path(os.environ["RUNNER_TEMP"]) / "vibescan-report")
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: ${{ runner.temp }}/vibescan-report/
          retention-days: 7
