[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibescan"
version = "0.2.0"
description = "로컬 Git 저장소용 웹앱 보안 진단기"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3",
  "PyJWT[crypto]>=2.10,<3", "pathspec>=0.12,<1",
  "pywin32>=306; sys_platform == 'win32'", "semgrep==1.185.0",
  "tree-sitter>=0.25,<0.26", "tree-sitter-java>=0.23,<0.24",
  "packaging>=21", "semantic-version>=2.10,<3",
]

[project.scripts]
vibescan = "vibescan.cli:main"

[tool.setuptools]
packages = ["scanner", "scanner.detectors", "vibescan"]

[tool.setuptools.package-data]
scanner = ["advisories.json.gz", "ADVISORIES-LICENSE.txt"]
vibescan = ["web/*.html", "web/*.svg", "web/*.css", "web/*.js", "web/fonts/*.woff2", "web/fonts/OFL.txt"]

[tool.setuptools.data-files]
"share/vibescan" = ["rules/catalog/owasp-top10-2025.yml", "rules/catalog/owasp-ai.yml", "rules/catalog/vibescan-top10.yml"]
"share/vibescan/rules" = ["rules/vibescan/*.yml"]

