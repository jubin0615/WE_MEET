{
  "rules": [
    {
      "id": "vs-js-xss",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "외부 입력의 HTML 응답",
      "metadata": {
        "cwe": "CWE-79",
        "vibescan": {
          "title_ko": "외부 입력의 HTML 응답",
          "remediation_ko": "textContent 또는 자동 이스케이프를 사용하세요.",
          "severity": "Medium",
          "confidence": "Likely",
          "impact_ko": "요청 값을 HTML 응답이나 innerHTML에 그대로 넣습니다. 공격자가 만든 링크를 연 사용자의 브라우저에서 스크립트가 실행됩니다(XSS).",
          "fix_example": "-res.send(`<h1>${req.query.name}</h1>`)\n+res.send(`<h1>${escapeHtml(req.query.name)}</h1>`)  // 또는 템플릿 엔진의 자동 이스케이프",
          "category": "VS-05",
          "limitations_ko": "출력 구문과 이스케이프 처리의 정적 단서에 한정하며 실제 렌더링 문맥은 수동 확인합니다."
        }
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern-either": [
            {
              "pattern": "$REQ.query.$X"
            },
            {
              "pattern": "$REQ.body.$X"
            },
            {
              "pattern": "$REQ.params.$X"
            },
            {
              "pattern": "location.hash"
            },
            {
              "pattern": "location.search"
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$RES.send($X)"
                },
                {
                  "pattern": "$EL.innerHTML = $X"
                }
              ]
            },
            {
              "focus-metavariable": "$X"
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "pattern-either": [
            {
              "pattern": "DOMPurify.sanitize(...)"
            }
          ]
        }
      ]
    }
  ]
}
