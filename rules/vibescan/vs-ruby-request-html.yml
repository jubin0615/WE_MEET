          "severity": "Medium",
          "confidence": "Potential",
          "impact_ko": "Rails 뷰가 요청 문자열을 안전한 HTML로 취급하면 사용자 입력이 페이지의 마크업으로 해석될 수 있습니다.",
          "fix_example": "-raw(params[:body])\n+h(params[:body])"
