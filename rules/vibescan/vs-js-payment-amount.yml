{
  "rules": [
    {
      "id": "vs-js-payment-amount",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "요청 금액을 결제 생성에 직접 사용",
      "metadata": {
        "cwe": "CWE-602",
        "kisa": [
          "CI-13"
        ],
        "vibescan": {
          "title_ko": "요청 금액을 결제 생성에 직접 사용",
          "remediation_ko": "서버에 저장한 상품 가격·수량·할인 정책으로 결제 금액을 계산하세요.",
          "severity": "Medium",
          "confidence": "Potential",
          "impact_ko": "브라우저가 보낸 금액과 주문 원장의 금액이 다르면 고객에게 잘못된 금액이 청구될 수 있습니다.",
          "fix_example": "-amount: req.body.amount\n+amount: order.total // 서버에서 조회한 주문의 결제 단위 기준 금액"
        }
      },
      "pattern-either": [
        {
          "pattern": "$SDK.paymentIntents.create({..., amount: $REQ.body.amount, ...}, ...)"
        },
        {
          "pattern": "$SDK.paymentIntents.create({..., amount: $REQ.body.price, ...}, ...)"
        }
      ]
    }
  ]
}
