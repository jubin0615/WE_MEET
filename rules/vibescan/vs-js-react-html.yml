{
  "rules": [
    {
      "id": "vs-js-react-html",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "React 원시 HTML 삽입",
      "metadata": {
        "cwe": "CWE-79",
        "vibescan": {
          "title_ko": "React 원시 HTML 삽입",
          "remediation_ko": "원시 HTML을 피하거나 검증된 HTML 정화기를 사용하세요.",
          "severity": "Medium",
          "confidence": "Potential",
          "impact_ko": "dangerouslySetInnerHTML은 문자열을 HTML로 그대로 넣습니다. 값에 사용자나 외부 데이터가 섞이면 스크립트가 실행되어 다른 사용자의 세션과 데이터를 탈취할 수 있습니다(XSS).",
          "fix_example": "-<div dangerouslySetInnerHTML={{ __html: post.body }} />\n+<div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(post.body) }} />  // 또는 {post.body}로 텍스트 출력",
          "category": "VS-05",
          "limitations_ko": "출력 구문과 이스케이프 처리의 정적 단서에 한정하며 실제 렌더링 문맥은 수동 확인합니다."
        }
      },
      "patterns": [
        {
          "pattern": "<$TAG ... dangerouslySetInnerHTML={{__html: $X}} ... />"
        },
        {
          "pattern-not": "<$TAG ... dangerouslySetInnerHTML={{__html: DOMPurify.sanitize(...)}} ... />"
        }
      ]
    }
  ]
}
