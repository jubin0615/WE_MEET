{
  "rules": [
    {
      "id": "vs-py-upload",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "검증하지 않은 업로드 파일명",
      "metadata": {
        "cwe": "CWE-434",
        "vibescan": {
          "title_ko": "검증하지 않은 업로드 파일명",
          "remediation_ko": "파일명·확장자·크기를 검증하고 실행 불가능한 위치에 저장하세요.",
          "severity": "High",
          "confidence": "Potential",
          "impact_ko": "업로드한 파일 이름을 그대로 써서 저장합니다. ../ 경로로 다른 파일을 덮어쓰거나, 실행 가능한 파일을 올려 서버나 다른 사용자를 공격할 수 있습니다.",
          "fix_example": "-f.save(os.path.join(UPLOADS, f.filename))\n+name = secure_filename(f.filename)\n+if Path(name).suffix.lower() not in {\".png\", \".jpg\", \".pdf\"}: abort(400)\n+f.save(UPLOADS / f\"{uuid4().hex}{Path(name).suffix}\")",
          "category": "VS-05",
          "limitations_ko": "지원하는 언어와 호출 패턴에 한정하며 다른 함수의 입력 검증과 실행 시점의 값은 수동 확인합니다."
        }
      },
      "patterns": [
        {
          "pattern-inside": "$F = flask.request.files[...]\n..."
        },
        {
          "pattern": "$F.save(<... $F.filename ...>, ...)"
        },
        {
          "pattern-not": "$F.save(<... werkzeug.utils.secure_filename(...) ...>, ...)"
        }
      ]
    }
  ]
}
