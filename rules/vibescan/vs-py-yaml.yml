{
  "rules": [
    {
      "id": "vs-py-yaml",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "안전하지 않은 YAML 역직렬화",
      "metadata": {
        "cwe": "CWE-502",
        "vibescan": {
          "title_ko": "안전하지 않은 YAML 역직렬화",
          "remediation_ko": "yaml.safe_load를 사용하세요.",
          "severity": "High",
          "confidence": "Potential",
          "impact_ko": "yaml.load에 전체 Loader를 쓰면 YAML 안의 태그로 파이썬 객체를 만들고 코드를 실행할 수 있습니다. 외부에서 받은 YAML이라면 서버가 장악될 수 있습니다.",
          "fix_example": "-data = yaml.load(text, Loader=yaml.Loader)\n+data = yaml.safe_load(text)",
          "category": "VS-05",
          "limitations_ko": "지원하는 언어와 호출 패턴에 한정하며 다른 함수의 입력 검증과 실행 시점의 값은 수동 확인합니다."
        }
      },
      "pattern-either": [
        {
          "pattern": "yaml.load($X, Loader=yaml.Loader)"
        },
        {
          "pattern": "yaml.load($X, Loader=yaml.UnsafeLoader)"
        }
      ]
    }
  ]
}
