{
  "rules": [
    {
      "id": "vs-py-path",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "입력값을 사용한 파일 접근",
      "metadata": {
        "cwe": "CWE-22",
        "vibescan": {
          "title_ko": "입력값을 사용한 파일 접근",
          "remediation_ko": "정규화된 경로가 기준 디렉터리 내부인지 검사하세요.",
          "severity": "High",
          "confidence": "Likely",
          "impact_ko": "요청 값으로 파일 경로를 만들면 ../ 같은 값으로 허용한 폴더 밖의 파일을 읽거나 덮어쓸 수 있습니다(경로 조작).",
          "fix_example": "-return send_file(os.path.join(UPLOADS, request.args[\"name\"]))\n+path = (UPLOADS / request.args[\"name\"]).resolve()\n+if not path.is_relative_to(UPLOADS): abort(400)\n+return send_file(path)",
          "category": "VS-05",
          "limitations_ko": "지원하는 언어와 호출 패턴에 한정하며 다른 함수의 입력 검증과 실행 시점의 값은 수동 확인합니다."
        }
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern-either": [
            {
              "pattern": "flask.request.$ATTR"
            },
            {
              "pattern": "flask.request.$ATTR[...]"
            },
            {
              "pattern": "flask.request.$ATTR.get(...)"
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "flask.send_file($X, ...)"
                },
                {
                  "pattern": "open($X, ...)"
                },
                {
                  "pattern": "starlette.responses.FileResponse($X, ...)"
                }
              ]
            },
            {
              "focus-metavariable": "$X"
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "pattern-either": [
            {
              "pattern": "werkzeug.utils.secure_filename(...)"
            },
            {
              "pattern": "werkzeug.security.safe_join(...)"
            }
          ]
        }
      ]
    }
  ]
}
