{
  "rules": [
    {
      "id": "concatenated-select",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "문자열을 결합한 SQL 실행",
      "metadata": {
        "cwe": "CWE-89",
        "vibescan": {
          "title_ko": "문자열을 결합한 SQL 실행",
          "remediation_ko": "DB 드라이버의 매개변수 바인딩을 사용하세요.",
          "severity": "High",
          "confidence": "Potential",
          "impact_ko": "문자열 결합으로 만든 SQL을 그대로 실행합니다. 결합한 값에 따옴표나 SQL 구문이 들어가면 쿼리 구조가 바뀌어 다른 사람의 데이터를 조회·수정·삭제할 수 있습니다(SQL 인젝션).",
          "fix_example": "-query = \"SELECT * FROM notes WHERE title = '\" + title + \"'\"\n-rows = db.execute(query)\n+rows = db.execute(\"SELECT * FROM notes WHERE title = ?\", (title,))",
          "category": "VS-05",
          "limitations_ko": "지원하는 언어와 호출 패턴에 한정하며 다른 함수의 입력 검증과 실행 시점의 값은 수동 확인합니다."
        }
      },
      "patterns": [
        {
          "pattern-inside": "$Q = $A + $B + $C\n..."
        },
        {
          "pattern": "$DB.execute($Q)"
        },
        {
          "metavariable-regex": {
            "metavariable": "$A",
            "regex": "(?i)^[\"']select\\s"
          }
        }
      ]
    }
  ]
}
