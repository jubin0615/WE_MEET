{
  "rules": [
    {
      "id": "vs-js-sql",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "외부 입력이 SQL에 도달",
      "metadata": {
        "cwe": "CWE-89",
        "vibescan": {
          "title_ko": "외부 입력이 SQL에 도달",
          "remediation_ko": "매개변수 바인딩을 사용하세요.",
          "severity": "High",
          "confidence": "Likely",
          "impact_ko": "요청 값이 SQL 문자열에 그대로 들어갑니다. 공격자가 쿼리 구조를 바꿔 인증을 우회하거나 전체 데이터를 조회·삭제할 수 있습니다(SQL 인젝션).",
          "fix_example": "-db.query(`SELECT * FROM users WHERE id = ${req.params.id}`)\n+db.query(\"SELECT * FROM users WHERE id = $1\", [req.params.id])",
          "category": "VS-05",
          "limitations_ko": "지원하는 언어와 호출 패턴에 한정하며 다른 함수의 입력 검증과 실행 시점의 값은 수동 확인합니다."
        }
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern-either": [
            {
              "pattern": "$REQ.query.$X"
            },
            {
              "pattern": "$REQ.body.$X"
            },
            {
              "pattern": "$REQ.params.$X"
            },
            {
              "pattern": "location.hash"
            },
            {
              "pattern": "location.search"
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$DB.query($X, ...)"
                },
                {
                  "pattern": "$DB.execute($X, ...)"
                },
                {
                  "pattern": "$DB.raw($X, ...)"
                },
                {
                  "pattern": "$DB.$queryRawUnsafe($X, ...)"
                }
              ]
            },
            {
              "focus-metavariable": "$X"
            }
          ]
        }
      ]
    }
  ]
}
