{
  "rules": [
    {
      "id": "vs-js-code",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "외부 입력의 코드·명령 실행",
      "metadata": {
        "cwe": "CWE-94",
        "vibescan": {
          "title_ko": "외부 입력의 코드·명령 실행",
          "remediation_ko": "입력을 실행하지 말고 고정 명령과 인자 배열을 사용하세요.",
          "severity": "High",
          "confidence": "Likely",
          "impact_ko": "요청 값이 eval·Function·child_process 같은 실행 함수로 들어갑니다. 공격자가 서버에서 임의 코드나 명령을 실행해 데이터와 서버 전체를 장악할 수 있습니다.",
          "fix_example": "-exec(`convert ${req.query.file} out.png`)\n+execFile(\"convert\", [safeName(req.query.file), \"out.png\"])  // 셸 없이 고정 명령 + 인자 배열",
          "category": "VS-05",
          "limitations_ko": "같은 함수의 지원 패턴에 한정하며 명령 실행도 기존 코드 실행 규칙(CWE-94)에 포함합니다."
        }
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern-either": [
            {
              "pattern": "$REQ.query.$X"
            },
            {
              "pattern": "$REQ.body.$X"
            },
            {
              "pattern": "$REQ.params.$X"
            },
            {
              "pattern": "location.hash"
            },
            {
              "pattern": "location.search"
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "eval($X)"
                },
                {
                  "pattern": "child_process.exec($X, ...)"
                },
                {
                  "pattern": "exec($X, ...)"
                },
                {
                  "pattern": "new Function($X)"
                }
              ]
            },
            {
              "focus-metavariable": "$X"
            }
          ]
        }
      ]
    }
  ]
}
