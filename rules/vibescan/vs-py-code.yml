{
  "rules": [
    {
      "id": "vs-py-code",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "외부 입력의 코드·명령 실행",
      "metadata": {
        "cwe": "CWE-94",
        "vibescan": {
          "title_ko": "외부 입력의 코드·명령 실행",
          "remediation_ko": "입력을 실행하지 말고 고정된 연산과 인자 목록을 사용하세요.",
          "severity": "High",
          "confidence": "Likely",
          "impact_ko": "요청 값이 eval·exec·os.system·subprocess(shell=True)로 들어갑니다. 공격자가 서버에서 임의 코드나 명령을 실행할 수 있습니다.",
          "fix_example": "-os.system(\"convert \" + request.args[\"file\"] + \" out.png\")\n+subprocess.run([\"convert\", safe_name(request.args[\"file\"]), \"out.png\"], check=True)  # 셸 없이 인자 목록",
          "category": "VS-05",
          "limitations_ko": "같은 함수의 지원 패턴에 한정하며 명령 실행도 기존 코드 실행 규칙(CWE-94)에 포함합니다."
        }
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern-either": [
            {
              "pattern": "flask.request.$ATTR"
            },
            {
              "pattern": "flask.request.$ATTR[...]"
            },
            {
              "pattern": "flask.request.$ATTR.get(...)"
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "eval($X, ...)"
                },
                {
                  "pattern": "exec($X, ...)"
                },
                {
                  "pattern": "os.system($X)"
                },
                {
                  "pattern": "subprocess.run($X, ..., shell=True, ...)"
                },
                {
                  "pattern": "subprocess.Popen($X, ..., shell=True, ...)"
                },
                {
                  "pattern": "pickle.loads($X, ...)"
                },
                {
                  "pattern": "flask.render_template_string($X, ...)"
                }
              ]
            },
            {
              "focus-metavariable": "$X"
            }
          ]
        }
      ]
    }
  ]
}
